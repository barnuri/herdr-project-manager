id = "barnuri.project-manager"
name = "Project Manager"
version = "0.1.1"
min_herdr_version = "0.7.0"
description = "Discover projects via globs or manual entries and open them as herdr tabs or workspaces"
platforms = ["linux", "macos"]

[[panes]]
id = "picker"
title = "Projects"
command = ["node", "bin/picker.js"]
placement = "split"

[[actions]]
id = "open-picker"
title = "Open project picker"
contexts = ["workspace", "pane"]
command = ["node", "bin/open-picker.js"]

[[actions]]
id = "add-current"
title = "Add current directory as project"
contexts = ["pane", "workspace"]
command = ["node", "bin/add-current.js"]

[[actions]]
id = "toggle-auto-open"
title = "Toggle auto-open project picker"
contexts = ["workspace", "pane"]
command = ["node", "bin/toggle-auto-open.js"]

[[actions]]
id = "edit-config"
title = "Edit project list"
contexts = ["workspace", "pane"]
command = ["node", "bin/edit-config.js"]

[[events]]
on = "tab.created"
command = ["node", "bin/ensure-picker.js"]

[[events]]
on = "workspace.created"
command = ["node", "bin/ensure-picker.js"]

[[events]]
on = "tab.focused"
command = ["node", "bin/ensure-picker.js"]

[[events]]
on = "workspace.focused"
command = ["node", "bin/ensure-picker.js"]

[[events]]
on = "pane.focused"
command = ["node", "bin/ensure-picker.js"]
